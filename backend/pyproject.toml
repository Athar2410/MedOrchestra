[project]
name = "medorchestra-backend"
version = "0.1.0"
description = "MedOrchestra multi-agent clinical decision support — API + LangGraph pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=0.6",
  "httpx>=0.27",
  "networkx>=3.3",
  "rapidfuzz>=3.9",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
# MedCPT encoders for PubMed retrieval. Install the CPU build of torch with:
#   pip install -e ".[dev,ml]" --extra-index-url https://download.pytorch.org/whl/cpu
ml = ["torch>=2.5", "transformers>=4.45"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
